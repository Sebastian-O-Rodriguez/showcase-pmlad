<text x="16" y="546" font-family="ui-monospace,Menlo,Monaco,Consolas,monospace" font-size="14" fill="#7dcfff" font-weight="700">═══════════════════════════════════════════════════════════════</text>
<text x="16" y="566" font-family="ui-monospace,Menlo,Monaco,Consolas,monospace" font-size="14" fill="#e0af68" font-weight="700">  2. UNSCOPED QUERY — app FORGOT session vars (the bug)</text>
<text x="16" y="586" font-family="ui-monospace,Menlo,Monaco,Consolas,monospace" font-size="14" fill="#7dcfff" font-weight="700">═══════════════════════════════════════════════════════════════</text>
<text x="16" y="606" font-family="ui-monospace,Menlo,Monaco,Consolas,monospace" font-size="14" fill="#bb9af7" font-weight="400">  (no app.current_org / app.current_entity set)</text>
<text x="16" y="626" font-family="ui-monospace,Menlo,Monaco,Consolas,monospace" font-size="14" fill="#c0caf5" font-weight="400">BEGIN</text>
