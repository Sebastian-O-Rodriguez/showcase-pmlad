<text x="16" y="426" font-family="ui-monospace,Menlo,Monaco,Consolas,monospace" font-size="14" fill="#c0caf5" font-weight="400"> Oak Manor    | 456 Oak Ave, OrgA-EntityA1</text>
<text x="16" y="446" font-family="ui-monospace,Menlo,Monaco,Consolas,monospace" font-size="14" fill="#c0caf5" font-weight="400"> Sunset Villa | 123 Main St, OrgA-EntityA1</text>
<text x="16" y="466" font-family="ui-monospace,Menlo,Monaco,Consolas,monospace" font-size="14" fill="#c0caf5" font-weight="400">(2 rows)</text>
<text x="16" y="486" font-family="ui-monospace,Menlo,Monaco,Consolas,monospace" font-size="14" fill="#c0caf5" font-weight="400"></text>
<text x="16" y="506" font-family="ui-monospace,Menlo,Monaco,Consolas,monospace" font-size="14" fill="#c0caf5" font-weight="400">ROLLBACK</text>
