<text x="16" y="746" font-family="ui-monospace,Menlo,Monaco,Consolas,monospace" font-size="14" fill="#c0caf5" font-weight="400"> visible_invoices </text>
<text x="16" y="766" font-family="ui-monospace,Menlo,Monaco,Consolas,monospace" font-size="14" fill="#c0caf5" font-weight="400">------------------</text>
<text x="16" y="786" font-family="ui-monospace,Menlo,Monaco,Consolas,monospace" font-size="14" fill="#f7768e" font-weight="400">                0</text>
<text x="16" y="806" font-family="ui-monospace,Menlo,Monaco,Consolas,monospace" font-size="14" fill="#c0caf5" font-weight="400">(1 row)</text>
<text x="16" y="826" font-family="ui-monospace,Menlo,Monaco,Consolas,monospace" font-size="14" fill="#c0caf5" font-weight="400"></text>
<text x="16" y="846" font-family="ui-monospace,Menlo,Monaco,Consolas,monospace" font-size="14" fill="#c0caf5" font-weight="400">ROLLBACK</text>
<text x="16" y="866" font-family="ui-monospace,Menlo,Monaco,Consolas,monospace" font-size="14" fill="#c0caf5" font-weight="400"></text>
<text x="16" y="886" font-family="ui-monospace,Menlo,Monaco,Consolas,monospace" font-size="14" fill="#7dcfff" font-weight="700">═══════════════════════════════════════════════════════════════</text>
<text x="16" y="906" font-family="ui-monospace,Menlo,Monaco,Consolas,monospace" font-size="14" fill="#e0af68" font-weight="700">  3. CROSS-TENANT QUERY — app asked for Org B&#x27;s entity</text>
<text x="16" y="926" font-family="ui-monospace,Menlo,Monaco,Consolas,monospace" font-size="14" fill="#7dcfff" font-weight="700">═══════════════════════════════════════════════════════════════</text>
<text x="16" y="946" font-family="ui-monospace,Menlo,Monaco,Consolas,monospace" font-size="14" fill="#bb9af7" font-weight="400">  app.current_org    = aaaaaaaa-0000-0000-0000-000000000001  (but querying entity bbbbbbbb-0000-0000-0000-000000000011)</text>
<text x="16" y="966" font-family="ui-monospace,Menlo,Monaco,Consolas,monospace" font-size="14" fill="#c0caf5" font-weight="400">BEGIN</text>
<text x="16" y="986" font-family="ui-monospace,Menlo,Monaco,Consolas,monospace" font-size="14" fill="#c0caf5" font-weight="400">SET</text>
<text x="16" y="1006" font-family="ui-monospace,Menlo,Monaco,Consolas,monospace" font-size="14" fill="#c0caf5" font-weight="400">SET</text>
<text x="16" y="1026" font-family="ui-monospace,Menlo,Monaco,Consolas,monospace" font-size="14" fill="#c0caf5" font-weight="400"> cross_tenant_rows </text>
<text x="16" y="1046" font-family="ui-monospace,Menlo,Monaco,Consolas,monospace" font-size="14" fill="#c0caf5" font-weight="400">-------------------</text>
<text x="16" y="1066" font-family="ui-monospace,Menlo,Monaco,Consolas,monospace" font-size="14" fill="#f7768e" font-weight="400">                 0</text>
<text x="16" y="1086" font-family="ui-monospace,Menlo,Monaco,Consolas,monospace" font-size="14" fill="#c0caf5" font-weight="400">(1 row)</text>
<text x="16" y="1106" font-family="ui-monospace,Menlo,Monaco,Consolas,monospace" font-size="14" fill="#c0caf5" font-weight="400"></text>
<text x="16" y="1126" font-family="ui-monospace,Menlo,Monaco,Consolas,monospace" font-size="14" fill="#c0caf5" font-weight="400">ROLLBACK</text>
<text x="16" y="1146" font-family="ui-monospace,Menlo,Monaco,Consolas,monospace" font-size="14" fill="#c0caf5" font-weight="400"></text>
<text x="16" y="1166" font-family="ui-monospace,Menlo,Monaco,Consolas,monospace" font-size="14" fill="#7dcfff" font-weight="700">═══════════════════════════════════════════════════════════════</text>
<text x="16" y="1186" font-family="ui-monospace,Menlo,Monaco,Consolas,monospace" font-size="14" fill="#e0af68" font-weight="700">  RESULT</text>
<text x="16" y="1206" font-family="ui-monospace,Menlo,Monaco,Consolas,monospace" font-size="14" fill="#7dcfff" font-weight="700">═══════════════════════════════════════════════════════════════</text>
<text x="16" y="1226" font-family="ui-monospace,Menlo,Monaco,Consolas,monospace" font-size="14" fill="#c0caf5" font-weight="400">Scoped query returns rows; unscoped and cross-tenant queries return 0.</text>
<text x="16" y="1246" font-family="ui-monospace,Menlo,Monaco,Consolas,monospace" font-size="14" fill="#c0caf5" font-weight="400">Isolation is enforced by PostgreSQL, not by application code.</text>
</svg>