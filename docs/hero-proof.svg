<circle cx="64" cy="20" r="6" fill="#9ece6a"/>
<text x="16" y="46" font-family="ui-monospace,Menlo,Monaco,Consolas,monospace" font-size="14" fill="#9ece6a" font-weight="700">RLS Default-Deny Demo — defense-in-depth survives an app bug</text>
<text x="16" y="66" font-family="ui-monospace,Menlo,Monaco,Consolas,monospace" font-size="14" fill="#c0caf5" font-weight="400">Connected as: app_role (restricted, non-superuser)</text>
<text x="16" y="86" font-family="ui-monospace,Menlo,Monaco,Consolas,monospace" font-size="14" fill="#c0caf5" font-weight="400">DB: postgresql://app_role:***@127.0.0.1:5433/showcase</text>
<text x="16" y="106" font-family="ui-monospace,Menlo,Monaco,Consolas,monospace" font-size="14" fill="#c0caf5" font-weight="400"></text>
<text x="16" y="126" font-family="ui-monospace,Menlo,Monaco,Consolas,monospace" font-size="14" fill="#7dcfff" font-weight="700">═══════════════════════════════════════════════════════════════</text>
<text x="16" y="146" font-family="ui-monospace,Menlo,Monaco,Consolas,monospace" font-size="14" fill="#e0af68" font-weight="700">  1. SCOPED (CORRECT) QUERY — app set session vars</text>
<text x="16" y="166" font-family="ui-monospace,Menlo,Monaco,Consolas,monospace" font-size="14" fill="#7dcfff" font-weight="700">═══════════════════════════════════════════════════════════════</text>
<text x="16" y="186" font-family="ui-monospace,Menlo,Monaco,Consolas,monospace" font-size="14" fill="#bb9af7" font-weight="400">  app.current_org    = aaaaaaaa-0000-0000-0000-000000000001</text>
<text x="16" y="206" font-family="ui-monospace,Menlo,Monaco,Consolas,monospace" font-size="14" fill="#bb9af7" font-weight="400">  app.current_entity = aaaaaaaa-0000-0000-0000-000000000011</text>
<text x="16" y="226" font-family="ui-monospace,Menlo,Monaco,Consolas,monospace" font-size="14" fill="#c0caf5" font-weight="400">BEGIN</text>
<text x="16" y="246" font-family="ui-monospace,Menlo,Monaco,Consolas,monospace" font-size="14" fill="#c0caf5" font-weight="400">SET</text>
<text x="16" y="266" font-family="ui-monospace,Menlo,Monaco,Consolas,monospace" font-size="14" fill="#c0caf5" font-weight="400">SET</text>
<text x="16" y="286" font-family="ui-monospace,Menlo,Monaco,Consolas,monospace" font-size="14" fill="#c0caf5" font-weight="400"> visible_properties </text>
<text x="16" y="306" font-family="ui-monospace,Menlo,Monaco,Consolas,monospace" font-size="14" fill="#c0caf5" font-weight="400">--------------------</text>
<text x="16" y="326" font-family="ui-monospace,Menlo,Monaco,Consolas,monospace" font-size="14" fill="#c0caf5" font-weight="400">                  2</text>
<text x="16" y="346" font-family="ui-monospace,Menlo,Monaco,Consolas,monospace" font-size="14" fill="#c0caf5" font-weight="400">(1 row)</text>
<text x="16" y="366" font-family="ui-monospace,Menlo,Monaco,Consolas,monospace" font-size="14" fill="#c0caf5" font-weight="400"></text>
