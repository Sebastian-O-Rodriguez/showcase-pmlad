<svg xmlns="http://www.w3.org/2000/svg" width="1049" height="1276" viewBox="0 0 1049 1276">
<rect width="100%" height="100%" fill="#1a1b26" rx="10"/>
<circle cx="24" cy="20" r="6" fill="#f7768e"/>
