services:
  postgres:
    image: postgres:16-alpine
    container_name: showcase-rls-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: showcase
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_demo
    volumes:
      - ./db/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./db/02-seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d showcase"]
      interval: 2s
      timeout: 5s
      retries: 5